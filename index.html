    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #0b0b0e;
        overflow: hidden;
        color: #ffffff;
      }
      /* Video Latar Belakang */
      .video-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }
      .video-background video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Efek Overlay Gradasi Gelap */
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 100%);
      }
      /* Konten Utama */
      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      /* Animasi Denyut untuk Logo Profil */
      .logo {
        width: 110px;
        height: 110px;
        margin-bottom: 20px;
        object-fit: cover;
        border-radius: 50%;
        border: 3px solid #ff2d55;
        filter: drop-shadow(0 0 15px rgba(255, 45, 85, 0.4));
        animation: pulseLogo 2s infinite ease-in-out;
      }
      /* Indikator Live */
      .live-badge {
        background: #00ff66;
        color: #000;
        font-size: 11px;
        font-weight: 800;
        padding: 4px 12px;
        border-radius: 20px;
        margin-bottom: 15px;
        letter-spacing: 1px;
        box-shadow: 0 0 10px rgba(0,255,102,0.5);
      }
      /* Teks Judul Utama */
      h3 {
        font-size: 26px;
        font-weight: 800;
        margin: 5px 0 15px 0;
        text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        line-height: 1.3;
        letter-spacing: -0.5px;
        max-width: 450px;
      }
      h3 span {
        color: #ff2d55;
      }
      /* Teks Sub-Judul */
      h5 {
        font-size: 15px;
        font-weight: 400;
        color: #b3b3b3;
        margin-bottom: 30px;
        letter-spacing: 0.5px;
      }
      /* Tombol CTA Agresif */
      .continue-btn {
        background: linear-gradient(135deg, #ff2d55 0%, #ff1443 100%);
        color: white;
        padding: 16px 55px;
        font-size: 21px;
        font-weight: 800;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        box-shadow: 0 0 25px rgba(255,45,85,0.6);
        animation: aggressiveGlow 1.5s infinite ease-in-out;
        transition: all 0.2s ease;
        letter-spacing: 1px;
      }
      .continue-btn:hover {
        transform: scale(1.04);
        box-shadow: 0 0 40px rgba(255,45,85,0.9);
      }
      /* Efek Animasi */
      @keyframes aggressiveGlow {
        0% { transform: scale(1); box-shadow: 0 0 20px rgba(255,45,85,0.6); }
        50% { transform: scale(1.03); box-shadow: 0 0 35px rgba(255,45,85,0.9), 0 0 15px rgba(255,20,67,0.4); }
        100% { transform: scale(1); box-shadow: 0 0 20px rgba(255,45,85,0.6); }
      }
      @keyframes pulseLogo {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
    </style>
